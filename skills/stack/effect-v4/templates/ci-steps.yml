- name: Validate skill bundle
  working-directory: .agents/skills/effect-v4
  run: python3 scripts/verify-package.py
- name: Install locked example dependencies
  working-directory: .agents/skills/effect-v4/examples
  run: npm ci
- name: Typecheck examples
  working-directory: .agents/skills/effect-v4/examples
  run: npm run check
- name: Test examples
  working-directory: .agents/skills/effect-v4/examples
  run: npm test
