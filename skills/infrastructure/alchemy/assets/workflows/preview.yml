# Requires a protected "preview" environment and reviewed workflow/code changes.
# Same-repository code is not inherently safe: environment approval is required.
name: Alchemy preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: alchemy-app-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      STAGE: pr-${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Recheck target after approval and queueing
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          node scripts/assert-preview-stage.mjs "$STAGE" "$PR_NUMBER"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.base.repo.full_name' <<< "$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.repo.full_name' <<< "$pr")" = "$GITHUB_REPOSITORY"
          if [ "$(jq -r '.state' <<< "$pr")" != "open" ]; then exit 0; fi
          if [ "$(jq -r '.head.sha' <<< "$pr")" != "$EXPECTED_HEAD_SHA" ]; then exit 0; fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        if: steps.guard.outputs.proceed == 'true'
        with:
          runtime: node@24
          install: false
          cache: false
      - if: steps.guard.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.proceed == 'true'
        run: pnpm run typecheck && pnpm run test:unit
      - name: Deploy approved preview
        if: steps.guard.outputs.proceed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-preview-stage.mjs "$STAGE" "$PR_NUMBER"
          pnpm exec alchemy provider check-env --provider Cloudflare
          pnpm exec alchemy deploy --config alchemy.run.ts --stage "$STAGE" --yes
      # Add an HTTP-only smoke test using this stage's non-secret output URL.
      # Do not use deploy/destroy hooks against the continuing preview stage.
