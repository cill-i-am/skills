# Uses trusted base-branch workflow and source. NEVER checkout the PR head here.
# Requires a protected preview environment and the same state backend as deploy.
name: Alchemy preview cleanup
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: alchemy-app-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the PR is still closed
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          node scripts/assert-preview-stage.mjs "$STAGE" "$PR_NUMBER"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.base.repo.full_name' <<< "$pr")" = "$GITHUB_REPOSITORY"
          if [ "$(jq -r '.state' <<< "$pr")" != "closed" ]; then exit 0; fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        if: steps.guard.outputs.proceed == 'true'
        with:
          runtime: node@24
          install: false
          cache: false
      - if: steps.guard.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Destroy only the verified preview stage
        if: steps.guard.outputs.proceed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-preview-stage.mjs "$STAGE" "$PR_NUMBER"
          pnpm exec alchemy provider check-env --provider Cloudflare
          pnpm exec alchemy destroy --config alchemy.run.ts --stage "$STAGE" --yes
